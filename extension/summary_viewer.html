<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aero Agent — Executive Knowledge Briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f43f5e;
      --primary-dark: #e11d48;
      --primary-light: #fff1f2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 60px;
    }

    /* Top Navigation Bar */
    .report-navbar {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
    }

    .btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border: none;
      color: white;
      box-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #e11d48, #be123c);
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* Meta Header Card */
    .header-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .doc-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-pink {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
    }

    .badge-green {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .badge-blue {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }

    .doc-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
    }

    .doc-meta-info {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Report Content Card */
    .content-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
      font-size: 14.5px;
      line-height: 1.75;
      color: #1e293b;
    }

    .content-card h1,
    .content-card h2,
    .content-card h3,
    .content-card h4 {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      margin-top: 24px;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .content-card h2 {
      font-size: 20px;
      font-weight: 800;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }

    .content-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .content-card h4 {
      font-size: 14.5px;
      font-weight: 700;
      color: #334155;
    }

    .content-card p {
      margin-bottom: 16px;
    }

    .content-card ul,
    .content-card ol {
      margin-left: 24px;
      margin-bottom: 18px;
    }

    .content-card li {
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .content-card strong {
      color: #0f172a;
      font-weight: 700;
    }

    .content-card blockquote {
      border-left: 4px solid var(--primary);
      background: var(--primary-light);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      font-style: italic;
      color: #881337;
    }

    .content-card code {
      background: #f1f5f9;
      color: #e11d48;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Consolas', monospace;
    }

    /* Structured Tables */
    .table-wrapper {
      overflow-x: auto;
      margin: 20px 0;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      color: #0f172a;
      padding: 10px 14px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }

    tr:nth-child(even) td {
      background-color: #fafbfc;
    }

    tr:hover td {
      background-color: #f1f5f9;
    }

    /* Print Stylesheet */
    @media print {
      .report-navbar {
        display: none;
      }
      body {
        background: white;
        padding: 0;
      }
      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .header-card, .content-card {
        border: none;
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Header Navbar -->
  <header class="report-navbar">
    <div class="brand-group">
      <div class="brand-icon">📑</div>
      <div>
        <h1 class="brand-title">Aero Agent Briefing Console</h1>
        <p class="brand-sub">Comprehensive Document &amp; Webpage Synthesis</p>
      </div>
    </div>
    <div class="nav-actions">
      <button id="copy-report-btn" class="btn">📋 Copy Report</button>
      <button id="print-report-btn" class="btn">🖨️ Export to PDF</button>
      <button id="close-tab-btn" class="btn btn-primary">✕ Close Tab</button>
    </div>
  </header>

  <!-- Content Container -->
  <main class="container">
    <div class="header-card">
      <div class="doc-badge-row">
        <span class="badge badge-pink" id="doc-type-badge">📑 PDF Document</span>
        <span class="badge badge-green">✓ 100% Grounded</span>
        <span class="badge badge-blue">Local Qwen2.5</span>
      </div>
      <h2 class="doc-title" id="report-title">Loading Knowledge Briefing...</h2>
      <div class="doc-meta-info">
        <span id="report-source">Source: Reading document...</span>
        <span id="report-date">Date: --</span>
      </div>
    </div>

    <article class="content-card" id="report-body">
      <p style="color: #64748b;">Synthesizing full multi-page document with local intelligence...</p>
    </article>
  </main>

  <script src="summary_viewer.js"></script>
</body>
</html>
